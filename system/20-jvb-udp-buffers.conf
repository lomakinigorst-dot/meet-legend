# Буферы UDP для видеомоста. Дефолт ядра — 208 КБ, чего не хватает на всплески трафика
# (включение демонстрации экрана): буфер переполняется, пакеты выбрасываются, и у людей
# рассыпается картинка. Значения из официальной установки Jitsi.
net.core.rmem_max=10485760
net.core.rmem_default=10485760
net.core.wmem_max=10485760
net.core.wmem_default=10485760
# Очередь пакетов на сетевой карте: дефолтная 1000 мала для видеотрафика.
net.core.netdev_max_backlog=10000
