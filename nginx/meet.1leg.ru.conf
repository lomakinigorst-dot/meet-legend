# --- Legend Connect (meet.1leg.ru) :443 ---
server {
    listen 443 ssl;
    http2 on;
    server_name meet.1leg.ru;

    ssl_certificate     /etc/letsencrypt/live/meet.1leg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.1leg.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 0;

    # Статика Jitsi: sub_filter применяется только к text/html, поэтому здесь НЕ глушим
    # Accept-Encoding — upstream отдаёт gzip (~1 МБ вместо 4.7 МБ несжатых бандлов).
    # Без этого блока каждый холодный вход во встречу качал app.bundle 3.4 МБ + lib-jitsi 1.1 МБ
    # в сыром виде → длинный «чёрный экран».
    # После выхода Jitsi уводит на свою служебную страницу (англоязычную, с советом про
    # горячие клавиши) — клиенту это показывать незачем. Отправляем на наш экран прощания.
    location ~ ^/static/close\d*\.html$ {
        return 302 https://op.1leg.ru/connect/bye;
    }

    location ~* \.(js|css|json|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|map|wasm)$ {
        proxy_pass         http://meet-web:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_pass         http://meet-web:80;
        proxy_set_header   Accept-Encoding "";
        sub_filter        '<title>Jitsi Meet</title>' '<title>Видеовстреча LEGENIX</title>';
        sub_filter        '<meta property="og:title" content="Jitsi Meet"/>' '<meta property="og:title" content="Видеовстреча LEGENIX"/><meta property="og:site_name" content="LEGENIX Connect"/><meta property="og:type" content="website"/><meta name="twitter:card" content="summary_large_image"/>';
        sub_filter        '<meta property="og:image" content="images/jitsilogo.png?v=1"/>' '<meta property="og:image" content="https://op.1leg.ru/legend-connect-logo.png"/><meta property="og:image:width" content="1595"/><meta property="og:image:height" content="880"/>';
        sub_filter        '<meta property="og:description" content="Join a WebRTC video conference powered by the Jitsi Videobridge"/>' '<meta property="og:description" content="Подключайтесь к встрече по ссылке — прямо в браузере, ставить ничего не нужно."/>';
        sub_filter        '<meta description="Join a WebRTC video conference powered by the Jitsi Videobridge"/>' '<meta description="Подключайтесь к встрече по ссылке — прямо в браузере, ставить ничего не нужно."/>';
        sub_filter        '<meta itemprop="description" content="Join a WebRTC video conference powered by the Jitsi Videobridge"/>' '<meta itemprop="description" content="Подключайтесь к встрече по ссылке — прямо в браузере, ставить ничего не нужно."/>';
        sub_filter        '<link rel="icon" href="images/favicon.svg?v=1">' '<link rel="icon" href="https://op.1leg.ru/legenix-icon.svg">';
        sub_filter        '<link rel="apple-touch-icon" href="images/apple-touch-icon.png">' '<link rel="apple-touch-icon" href="https://op.1leg.ru/legenix-icon.svg">';
        sub_filter        '</head>' '<link rel="stylesheet" href="https://op.1leg.ru/jitsi-legend.css?v=2"><script defer src="https://op.1leg.ru/jitsi-toolbar.js"></script><script defer src="https://op.1leg.ru/legend-pip.js"></script><script defer src="https://op.1leg.ru/legend-record.js"></script></head>';
        sub_filter_once    on;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 900s;
    }
}
