# Legend Connect — хостовый nginx для meet.1leg.ru
# TLS терминируется здесь, трафик проксируется в Jitsi web (127.0.0.1:8000).
# Ставится на новый сервер Legend рядом с nginx op-dashboard (отдельный server-блок).
# Сертификат: certbot --nginx -d meet.1leg.ru  (или свой путь ниже).

server {
    listen 80;
    listen [::]:80;
    server_name meet.1leg.ru;
    # ACME + редирект на HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meet.1leg.ru;

    ssl_certificate     /etc/letsencrypt/live/meet.1leg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.1leg.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Jitsi web (HTTP) внутри стека legend-connect
    set $jitsi_web http://127.0.0.1:8000;

    # WebSocket upgrade (colibri + xmpp) — обязательно, иначе видео/сигналинг не поедут
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass $jitsi_web;
    }

    # Явные ws-эндпоинты (на случай строгих таймаутов)
    location /xmpp-websocket {
        proxy_pass $jitsi_web;
        proxy_read_timeout 900s;
    }
    location /colibri-ws {
        proxy_pass $jitsi_web;
        proxy_read_timeout 900s;
    }
}
