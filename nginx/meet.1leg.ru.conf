# Legend Connect — server-блоки для meet.1leg.ru
# ВСТАВЛЯЮТСЯ в /opt/legend/nginx.conf (тот же паттерн, что op.1leg.ru: webroot ACME + TLS).
# web-контейнер Jitsi подключён в сеть legend_default с алиасом meet-web (см. docker-compose.override.yml).

server {
    listen 80;
    server_name meet.1leg.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name meet.1leg.ru;

    ssl_certificate     /etc/letsencrypt/live/meet.1leg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.1leg.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 0;

    # WebSocket (xmpp + colibri) + обычный трафик — всё на web-контейнер Jitsi
    location / {
        proxy_pass         http://meet-web:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 900s;
    }
}
